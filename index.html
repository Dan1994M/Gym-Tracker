<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gym-Auslastungs-Tracker</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel2: #22262f;
    --border: #2e333d;
    --text: #e6e9ef;
    --muted: #8b93a1;
    --accent: #4f9dff;
    --accent2: #34d399;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-top: env(safe-area-inset-top); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 16px; -webkit-tap-highlight-color: transparent;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
  label { font-size: 12px; color: var(--muted); }
  input, select, button {
    font-size: 15px; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .pctwrap { display: flex; align-items: center; gap: 12px; }
  input[type=range] { flex: 1; accent-color: var(--accent); padding: 0; }
  .pctval { font-size: 24px; font-weight: 700; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  button {
    cursor: pointer; background: var(--accent); border: none; color: #fff; font-weight: 600;
    transition: filter .15s;
  }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: var(--panel2); border: 1px solid var(--border); color: var(--text); font-weight: 500; }
  .btnrow { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 4px; text-align: center; }
  th { color: var(--muted); font-weight: 500; }
  .hcell { border-radius: 4px; font-variant-numeric: tabular-nums; color: #0f1115; font-weight: 600; }
  .hcell.empty { background: var(--panel2); color: var(--muted); font-weight: 400; }
  .hour-label { color: var(--muted); text-align: right; padding-right: 8px; font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; }
  .best { display: flex; flex-direction: column; gap: 8px; }
  .best-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: var(--panel2); border-radius: 8px; }
  .best-item .rank { color: var(--accent2); font-weight: 700; margin-right: 8px; }
  .best-item .val { color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty-state { color: var(--muted); font-size: 14px; text-align: center; padding: 20px; }
  .log-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid var(--border); font-size: 13px; align-items: center; }
  .log-item:last-child { border: none; }
  .log-item .del { color: #ef4444; cursor: pointer; background: none; border: none; font-size: 16px; padding: 2px 8px; }
  .log-meta { color: var(--muted); font-size: 12px; }
  .legend { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 8px; }
  .legend .bar { flex: 1; height: 10px; border-radius: 4px; background: linear-gradient(90deg, #34d399, #fbbf24, #ef4444); }
  .muted { color: var(--muted); font-size: 12px; }
  .count { color: var(--muted); font-size: 10px; display: block; }
</style>
</head>
<body>
  <h1>🏋️ Gym-Auslastungs-Tracker</h1>
  <div class="sub">Erfasse die Auslastung in %, um deine ruhigsten Trainingszeiten zu finden.</div>

  <div class="card">
    <h2>Neuer Eintrag</h2>
    <div class="row">
      <div class="field">
        <label for="date">Datum</label>
        <input type="date" id="date">
      </div>
      <div class="field">
        <label for="hour">Uhrzeit (Stunde)</label>
        <select id="hour"></select>
      </div>
    </div>
    <div class="field" style="margin-top:12px;">
      <label for="pct">Auslastung</label>
      <div class="pctwrap">
        <input type="range" id="pct" min="0" max="100" step="5" value="50">
        <span class="pctval" id="pctval">50%</span>
      </div>
    </div>
    <div class="btnrow">
      <button id="save">Speichern</button>
      <button class="ghost" id="now">Jetzt</button>
    </div>
  </div>

  <div class="card">
    <h2>Beste Trainingszeiten</h2>
    <div class="best" id="best"><div class="empty-state">Noch keine Daten.</div></div>
  </div>

  <div class="card">
    <h2>Heatmap (Ø Auslastung)</h2>
    <div class="scroll"><div id="heatmap"></div></div>
    <div class="legend"><span>leer</span><div class="bar"></div><span>voll</span></div>
    <div class="muted" style="margin-top:6px;">Zahl = Ø %, kleine Zahl = Anzahl Messungen</div>
  </div>

  <div class="card">
    <h2>Verlauf</h2>
    <div id="log"><div class="empty-state">Noch keine Einträge.</div></div>
    <div class="btnrow">
      <button class="ghost" id="export">Export JSON</button>
      <button class="ghost" id="import">Import JSON</button>
      <input type="file" id="importfile" accept=".json" style="display:none">
    </div>
  </div>

<script>
const KEY = 'gymTracker_v1';
const DAYS = ['Mo','Di','Mi','Do','Fr','Sa','So'];
let data = load();

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; }
  catch { return []; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(data)); }

// ISO weekday: 0=Mo ... 6=So
function isoDow(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return (d.getDay() + 6) % 7;
}

// --- Init form ---
const hourSel = document.getElementById('hour');
for (let h = 0; h < 24; h++) {
  const o = document.createElement('option');
  o.value = h; o.textContent = String(h).padStart(2,'0') + ':00';
  hourSel.appendChild(o);
}
const pct = document.getElementById('pct');
const pctval = document.getElementById('pctval');
pct.oninput = () => pctval.textContent = pct.value + '%';

function setNow() {
  const n = new Date();
  document.getElementById('date').value = n.toISOString().slice(0,10);
  hourSel.value = n.getHours();
}
setNow();
document.getElementById('now').onclick = setNow;

document.getElementById('save').onclick = () => {
  const date = document.getElementById('date').value;
  if (!date) { alert('Bitte Datum wählen.'); return; }
  data.push({ date, hour: +hourSel.value, pct: +pct.value, ts: Date.now() });
  save(); render();
};

// --- Aggregation ---
function buildGrid() {
  // grid[dow][hour] = {sum, n}
  const grid = Array.from({length:7}, () => Array.from({length:24}, () => ({sum:0, n:0})));
  for (const e of data) {
    const dow = isoDow(e.date);
    const c = grid[dow][e.hour];
    c.sum += e.pct; c.n++;
  }
  return grid;
}

function color(v) {
  // 0..100 -> green->yellow->red
  const t = v / 100;
  let r, g, b;
  if (t < 0.5) { const k = t*2; r = Math.round(52+(251-52)*k); g = Math.round(211+(191-211)*k); b = Math.round(153+(36-153)*k); }
  else { const k = (t-0.5)*2; r = Math.round(251+(239-251)*k); g = Math.round(191+(68-191)*k); b = Math.round(36+(68-36)*k); }
  return `rgb(${r},${g},${b})`;
}

function renderHeatmap(grid) {
  // only show hours that have any data, else 6-23 default
  let minH = 24, maxH = 0, any = false;
  for (let h=0;h<24;h++) for (let d=0;d<7;d++) if (grid[d][h].n){ any=true; minH=Math.min(minH,h); maxH=Math.max(maxH,h); }
  if (!any) { document.getElementById('heatmap').innerHTML = '<div class="empty-state">Noch keine Daten.</div>'; return; }
  minH = Math.max(0, minH); maxH = Math.min(23, maxH);
  let html = '<table><tr><th></th>';
  for (const d of DAYS) html += `<th>${d}</th>`;
  html += '</tr>';
  for (let h=minH; h<=maxH; h++) {
    html += `<tr><td class="hour-label">${String(h).padStart(2,'0')}</td>`;
    for (let d=0; d<7; d++) {
      const c = grid[d][h];
      if (c.n) {
        const avg = Math.round(c.sum/c.n);
        html += `<td><div class="hcell" style="background:${color(avg)}">${avg}<span class="count">${c.n}×</span></div></td>`;
      } else {
        html += `<td><div class="hcell empty">–</div></td>`;
      }
    }
    html += '</tr>';
  }
  html += '</table>';
  document.getElementById('heatmap').innerHTML = html;
}

function renderBest(grid) {
  const slots = [];
  for (let d=0; d<7; d++) for (let h=0; h<24; h++) {
    const c = grid[d][h];
    if (c.n) slots.push({ d, h, avg: c.sum/c.n, n: c.n });
  }
  const el = document.getElementById('best');
  if (!slots.length) { el.innerHTML = '<div class="empty-state">Noch keine Daten.</div>'; return; }
  slots.sort((a,b) => a.avg - b.avg);
  el.innerHTML = slots.slice(0,5).map((s,i) =>
    `<div class="best-item"><div><span class="rank">#${i+1}</span>${DAYS[s.d]} ${String(s.h).padStart(2,'0')}:00</div>`+
    `<div class="val">Ø ${Math.round(s.avg)}% · ${s.n} Mess.</div></div>`
  ).join('');
}

function renderLog() {
  const el = document.getElementById('log');
  if (!data.length) { el.innerHTML = '<div class="empty-state">Noch keine Einträge.</div>'; return; }
  const sorted = [...data].map((e,i)=>({e,i})).sort((a,b)=>b.e.ts-a.e.ts).slice(0,30);
  el.innerHTML = sorted.map(({e,i}) => {
    const dow = DAYS[isoDow(e.date)];
    return `<div class="log-item"><div>${e.date} (${dow}) · ${String(e.hour).padStart(2,'0')}:00`+
      `<span class="log-meta"> — ${e.pct}%</span></div>`+
      `<button class="del" data-i="${i}">✕</button></div>`;
  }).join('');
  el.querySelectorAll('.del').forEach(b => b.onclick = () => {
    data.splice(+b.dataset.i, 1); save(); render();
  });
}

function render() {
  const grid = buildGrid();
  renderHeatmap(grid);
  renderBest(grid);
  renderLog();
}

// --- Export / Import ---
document.getElementById('export').onclick = () => {
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gym-tracker-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
};
document.getElementById('import').onclick = () => document.getElementById('importfile').click();
document.getElementById('importfile').onchange = (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const imp = JSON.parse(r.result);
      if (Array.isArray(imp)) { data = imp; save(); render(); alert('Import erfolgreich: '+imp.length+' Einträge.'); }
      else alert('Ungültiges Format.');
    } catch { alert('Fehler beim Lesen der Datei.'); }
  };
  r.readAsText(f);
};

render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
