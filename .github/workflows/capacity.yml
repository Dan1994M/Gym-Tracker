name: Auslastung erfassen

on:
  schedule:
    - cron: '7 * * * *'   # stündlich (UTC), GitHub startet oft einige Minuten später
  workflow_dispatch:       # manueller Start zum Testen

permissions:
  contents: write

concurrency:
  group: capacity
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Auslastung abrufen und anhängen
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          # Alte Exerp-API (centerId 290) liefert seit 13.11.2026 HTTP 401.
          # myFitApp-Anzeige, Langenfeld-Berghausen = 160181
          URL = 'https://api.myfitapp.de/metric/display/160181'

          req = urllib.request.Request(URL, headers={
              'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)'})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read().decode('utf-8', 'replace')
          except Exception as ex:
              raise SystemExit(f'Abruf fehlgeschlagen: {ex!r}')

          def attr(name):
              m = re.search(name + r'="(\d+)"', raw)
              return int(m.group(1)) if m else None

          n = attr('data-display-val')
          mx = attr('data-max')
          pct = attr('data-display-percentage')
          print('Werte:', {'count': n, 'max': mx, 'pct': pct})
          if pct is None and (n is None or not mx):
              print('Antwort (Anfang):', raw[:500])
              raise SystemExit('Keine Auslastungswerte in der Antwort')
          if pct is None:
              pct = round(n / mx * 100)
          if (n == 0) or (n is None and pct == 0):
              print('0 Personen (vermutlich geschlossen) – nicht gespeichert')
              raise SystemExit(0)

          now = datetime.now(ZoneInfo('Europe/Berlin'))
          entry = {
              'date': now.strftime('%Y-%m-%d'),
              'hour': now.hour,
              'pct': min(100, pct),
              'count': n,
              'max': mx,
              'ts': int(time.time() * 1000),
          }

          try:
              data = json.load(open('data.json', encoding='utf-8'))
          except Exception:
              data = []
          if any(e['date'] == entry['date'] and e['hour'] == entry['hour'] for e in data):
              print('Slot bereits erfasst')
              raise SystemExit(0)
          data.append(entry)
          json.dump(data, open('data.json', 'w', encoding='utf-8'), separators=(',', ':'))
          print('Gespeichert:', entry)
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --cached --quiet || git commit -m "Auslastung $(TZ=Europe/Berlin date '+%F %H:00')"
          git pull --rebase --quiet && git push
